name: Full verification

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/koishi-plugin-dashboard/frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix packages/koishi-plugin-dashboard/frontend

      - name: Run the repository trust entry
        run: npm run test:full
